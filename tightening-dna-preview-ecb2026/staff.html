<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>EC Beauty｜員工專區（TEST）</title><link rel="stylesheet" href="/tightening-dna-preview-dist/staff.css?v=1"><link rel="stylesheet" href="/tightening-dna-preview-dist/staff-records.css?v=1"></head><body><main class="staff-shell">
<header><span>TEST / PREVIEW</span><p>EC BEAUTY · STAFF PORTAL</p><h1>員工專區</h1></header>
<section class="staff-card" data-login><h2>分店登入</h2><form><label>分店<select name="storeId" required><option value="red_market">紅街市</option><option value="hac_sa_wan">黑沙環</option><option value="taipa">氹仔</option><option value="fai_chi_kei">筷子基</option></select></label><label>分店密碼<input name="password" type="password" autocomplete="current-password" required></label><button>登入</button><p data-message></p></form></section>
<section class="staff-app" data-app hidden><div class="staff-toolbar"><b data-store></b><button data-logout>登出</button></div><nav><button class="is-active" data-tab="redeem">掃描／核銷</button><button data-tab="records">客戶／核銷記錄</button><button data-tab="materials">療程內部資料／價目</button></nav>
<div data-panel="redeem"><h2>掃描 QR 或輸入核銷碼</h2><p>掃描後只會先顯示資料，必須再次確認先會核銷。</p><button class="scanner-toggle" type="button" data-scanner-toggle>開啟相機掃描 QR</button><div class="scanner" data-scanner hidden><video data-scanner-video playsinline muted></video><p data-scanner-message>請將 QR Code 放入鏡頭範圍。</p></div><div class="manual-divider"><span>或手動輸入</span></div><form data-lookup><input name="value" placeholder="貼上 QR 連結或 EC-… 核銷碼" autocomplete="off" required><button>查詢憑證</button></form><article class="voucher-result" data-voucher hidden></article><p data-app-message role="status" aria-live="polite"></p></div>
<div data-panel="records" hidden><h2>客戶／核銷記錄</h2><p>只顯示 Shared Campaign TEST 可可靠取得的 Voucher 與 Redemption 資料；未連接 Manus Consultation。</p><div class="staff-records" data-records><p>開啟此頁時載入記錄。</p></div></div>
<div data-panel="materials" hidden><h2>療程內部資料</h2><p class="internal-warning">只限已登入員工使用；不可向客戶公開或轉發。</p><div class="internal-images" data-materials><p>開啟此頁時載入已授權資料。</p></div></div>
</section></main><script src="/tightening-dna-preview-dist/staff.js?v=1" defer></script></body></html>
