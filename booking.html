<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>立即預約 | EC BEAUTY 易思美容</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #443025;
      --border: #7F5836;
      --bg-main: #FFD7D5;
      --footer: #AA7F66;
      --accent: #EC9C9D;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-main); color: var(--text); letter-spacing: 0.03em; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 80px 20px 40px; }
    .booking-box { background: #fff; border-radius: 8px; padding: 50px 40px; max-width: 500px; width: 100%; position: relative; box-shadow: 0 8px 40px rgba(68,48,37,0.15); border: 2px solid var(--border); }
    .booking-back { position: absolute; top: 16px; left: 16px; background: none; border: none; color: var(--border); font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; transition: color 0.2s; text-decoration: none; }
    .booking-back:hover { color: var(--accent); }
    .booking-title { text-align: center; margin-bottom: 30px; padding-top: 10px; }
    .booking-title .eyebrow { color: var(--accent); font-size: 0.72rem; letter-spacing: 0.3em; margin-bottom: 8px; font-family: 'Playfair Display', serif; }
    .booking-title h2 { font-family: 'Noto Serif TC', serif; color: var(--text); font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    .booking-title .selected-service { font-size: 0.82rem; color: var(--accent); letter-spacing: 0.1em; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; color: var(--text); font-size: 0.82rem; font-weight: 500; margin-bottom: 6px; letter-spacing: 0.05em; }
    .form-group input, .form-group select { width: 100%; padding: 12px 14px; background: #fff; border: 2px solid var(--border); border-radius: 4px; color: var(--text); font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color 0.2s, box-shadow 0.2s; box-sizing: border-box; }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(236,156,157,0.2); }
    .form-group input::placeholder { color: #AA7F66; }
    .form-group select option { background: #fff; }
    .form-error { color: #C0392B; font-size: 0.78rem; margin-top: 4px; display: none; }
    .form-error.show { display: block; }
    .form-submit { width: 100%; padding: 14px; background: var(--accent); color: var(--text); border: none; border-radius: 4px; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.1em; cursor: pointer; font-family: inherit; margin-top: 10px; transition: background 0.2s; }
    .form-submit:hover { background: var(--border); color: #fff; }
    .booking-nav-bar { background: var(--text); border-bottom: 3px solid var(--accent); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; left: 0; right: 0; z-index: 200; }
    .booking-nav-brand { font-family: 'Playfair Display', serif; color: var(--bg-main); font-size: 1.05rem; font-weight: 700; }
    .booking-nav-back { color: var(--bg-main); text-decoration: none; font-size: 0.82rem; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
    .booking-nav-back:hover { color: var(--accent); }
    .product-image-section { margin-bottom: 24px; text-align: center; overflow: visible; }
    .product-image-section img { width: 100%; height: auto; display: block; object-fit: initial; cursor: pointer; border-radius: 8px; border: 2px solid var(--border); transition: transform 0.2s; }
    .product-image-section img:hover { transform: scale(1.02); }
    .lightbox { display: none; position: fixed; z-index: 999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
    .lightbox.show { display: flex; }
    .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; }
    .lightbox-close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; }
    .branch-address { display: none; margin-top: 8px; font-size: 0.8rem; color: var(--border); line-height: 1.6; }
    @media (max-width: 640px) { .booking-box { padding: 36px 20px; } }
  </style>
</head>
<body>
<div class="booking-nav-bar">
  <a href="index.html" class="booking-nav-back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
    返回
  </a>
  <div class="booking-nav-brand">EC BEAUTY 易思美容</div>
  <div style="width:60px"></div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<!-- Hidden form for Formspree -->
<form id="hidden-form" method="POST" action="https://formspree.io/f/mdayzyej" style="display:none;" target="hidden_iframe" onsubmit="setTimeout(function(){window.location.replace('payment.html');}, 500);">
  <input type="text" name="姓名" id="fs-name">
  <input type="text" name="電話" id="fs-phone">
  <input type="text" name="療程" id="fs-product">
  <input type="text" name="預約時間" id="fs-datetime">
  <input type="text" name="分店" id="fs-branch">
  <input type="text" name="備註" id="fs-note">
</form>

<div class="booking-box">
  <a href="index.html" class="booking-back">← 返回首頁</a>
  <div class="product-image-section" id="product-image-section" style="display:none;">
    <img src="" alt="療程圖片" id="product-image" onclick="openLightbox()">
  </div>
  <div class="booking-title">
    <div class="eyebrow">RESERVATION</div>
    <h2 id="form-title">課程報名</h2>
    <div class="selected-service" id="selected-service"></div>
  </div>

  <form id="booking-form" onsubmit="return false;">
    <div class="form-group">
      <label>姓名</label>
      <input type="text" id="field-name" placeholder="請輸入您的姓名" required>
      <div class="form-error" id="err-name"></div>
    </div>
    <div class="form-group">
      <label>聯絡電話</label>
      <input type="tel" id="field-phone" placeholder="請輸入您的手機號碼" required>
      <div class="form-error" id="err-phone"></div>
    </div>
    <div class="form-group">
      <label>選擇療程</label>
      <select id="field-product">
        <option value="好「柚」運氣SPA療程">好「柚」運氣SPA療程 — $498</option>
        <option value="清潔女皇">清潔女皇 — $298</option>
        <option value="瘦身纖體">瘦身纖體 — $2,388 / 40次</option>
      </select>
      <div class="form-error" id="err-product"></div>
    </div>
    <div class="form-group">
      <label>希望預約時間</label>
      <input type="datetime-local" id="field-datetime" required>
      <div class="form-error" id="err-datetime"></div>
    </div>
    <div class="form-group">
      <label>選擇分店</label>
      <select id="field-branch" required>
        <option value="">請選擇分店</option>
        <option value="紅街市店">紅街市店</option>
        <option value="黑沙環店">黑沙環店</option>
        <option value="筷子基店">筷子基店</option>
        <option value="氹仔店">氹仔店</option>
      </select>
      <div class="form-error" id="err-branch"></div>
      <div id="branch-address-display" class="branch-address"></div>
    </div>
    <div class="form-group">
      <label>備註（選填）</label>
      <input type="text" id="field-note" placeholder="其他需求">
    </div>
    <button type="button" class="form-submit" id="submit-btn">確認預約</button>
  </form>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var product = params.get('product') || '好「柚」運氣SPA療程';
  var price = params.get('price') || '$498';
  var img = params.get('img');
  document.getElementById('form-title').textContent = product;
  document.getElementById('selected-service').textContent = price;
  document.getElementById('field-product').value = product;
  if (img) {
    var imgEl = document.getElementById('product-image');
    imgEl.src = img;
    document.getElementById('product-image-section').style.display = 'block';
  }

  var addresses = {
    '紅街市店': '澳門提督馬路123號A（紅街市正對面）',
    '黑沙環店': '澳門勞動節街28號（中葡職中對面）',
    '筷子基店': '澳門沙梨頭街56-58號聯薪廣場地下CF座（聯新停車場旁）',
    '氹仔店': '氹仔布拉干薩街47-L美景花園第七座地下BE（宣道堂側）'
  };

  document.getElementById('field-branch').addEventListener('change', function() {
    var addr = document.getElementById('branch-address-display');
    var val = this.value;
    if (val && addresses[val]) {
      addr.textContent = addresses[val];
      addr.style.display = 'block';
    } else {
      addr.style.display = 'none';
    }
  });

  document.getElementById('submit-btn').addEventListener('click', function() {
    var name = document.getElementById('field-name').value.trim();
    var phone = document.getElementById('field-phone').value.trim();
    var productVal = document.getElementById('field-product').value;
    var branch = document.getElementById('field-branch').value;
    var datetime = document.getElementById('field-datetime').value;

    var errs = document.querySelectorAll('.form-error');
    for (var i = 0; i < errs.length; i++) errs[i].classList.remove('show');

    if (!name) { document.getElementById('err-name').textContent = '請輸入姓名'; document.getElementById('err-name').classList.add('show'); return; }
    if (!phone) { document.getElementById('err-phone').textContent = '請輸入電話'; document.getElementById('err-phone').classList.add('show'); return; }
    if (!branch) { document.getElementById('err-branch').textContent = '請選擇分店'; document.getElementById('err-branch').classList.add('show'); return; }
    if (!datetime) { document.getElementById('err-datetime').textContent = '請選擇時間'; document.getElementById('err-datetime').classList.add('show'); return; }

    var fullBranch = branch + '：' + (addresses[branch] || '');

    localStorage.setItem('bookingName', name);
    localStorage.setItem('bookingProduct', productVal);
    localStorage.setItem('bookingPrice', price);
    localStorage.setItem('bookingDatetime', datetime);
    localStorage.setItem('bookingBranch', fullBranch);
    localStorage.setItem('bookingNote', document.getElementById('field-note').value);

    document.getElementById('fs-name').value = name;
    document.getElementById('fs-phone').value = phone;
    document.getElementById('fs-product').value = productVal;
    document.getElementById('fs-datetime').value = datetime;
    document.getElementById('fs-branch').value = fullBranch;
    document.getElementById('fs-note').value = document.getElementById('field-note').value;

    document.getElementById('hidden-form').submit();
  });
})();
function openLightbox() { var img = document.getElementById('product-image').src; document.getElementById('lightbox-img').src = img; document.getElementById('lightbox').classList.add('show'); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }
</script>
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <img src="" id="lightbox-img" alt="放大圖片">
</div>

</body>
</html>
